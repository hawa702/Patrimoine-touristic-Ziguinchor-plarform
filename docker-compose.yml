# Plateforme "Patrimoine touristique de Ziguinchor"
#
#   navigateur ──> frontend (nginx :4200) ──/api──> api-gateway (:8080) ──> microservices
#
# Seuls le frontend (4200) et la gateway (8080) sont publiés sur la machine.
# Les microservices ne sont joignables que par le réseau Docker interne :
# toute requête passe donc obligatoirement par la gateway (validation du JWT + rôles).
# Pour tester un microservice directement (Postman) : docker-compose.debug.yml

name: patrimoine

x-microservice: &microservice
  restart: unless-stopped
  networks: [backend]

services:

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks: [backend]

  api-gateway:
    <<: *microservice
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_AUTH_URL: http://ms-auth:3005
      SERVICES_AVIS_URL: http://ms-avis:3006
      SERVICES_PATRIMOINE_URL: http://ms-patrimoine:3001
      SERVICES_CIRCUIT_URL: http://ms-circuit:3002
      SERVICES_EVENEMENT_URL: http://ms-evenement:3003
      SERVICES_RESERVATION_URL: http://ms-reservation:3004
    depends_on:
      - ms-auth
      - ms-avis
      - ms-patrimoine
      - ms-circuit
      - ms-evenement
      - ms-reservation

  ms-auth:
    <<: *microservice
    build: ./services/ms-auth
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/authdb
    volumes:
      - auth-data:/data

  ms-avis:
    <<: *microservice
    build: ./services/ms-avis
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/avisdb
    volumes:
      - avis-data:/data

  ms-patrimoine:
    <<: *microservice
    build: ./services/ms-patrimoine
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/patrimoinedb
    volumes:
      - patrimoine-data:/data

  ms-circuit:
    <<: *microservice
    build: ./services/ms-circuit
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/circuitdb
      SERVICES_PATRIMOINE_URL: http://ms-patrimoine:3001
    volumes:
      - circuit-data:/data
    depends_on:
      - ms-patrimoine

  ms-evenement:
    <<: *microservice
    build: ./services/ms-evenement
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/evenementdb
      SERVICES_PATRIMOINE_URL: http://ms-patrimoine:3001
    volumes:
      - evenement-data:/data
    depends_on:
      - ms-patrimoine

  ms-reservation:
    <<: *microservice
    build: ./services/ms-reservation
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/reservationdb
      SERVICES_CIRCUIT_URL: http://ms-circuit:3002
      SERVICES_EVENEMENT_URL: http://ms-evenement:3003
    volumes:
      - reservation-data:/data
    depends_on:
      - ms-circuit
      - ms-evenement

networks:
  backend:

# Les bases H2 sont stockées dans des volumes : les données survivent à "docker compose down"
# (pour tout réinitialiser : docker compose down -v)
volumes:
  auth-data:
  avis-data:
  patrimoine-data:
  circuit-data:
  evenement-data:
  reservation-data:
