# Publie les ports des microservices sur la machine (utile pour Postman / debug).
# Usage : docker compose -f docker-compose.yml -f docker-compose.debug.yml up --build
# ATTENTION : accès direct sans JWT, à ne jamais utiliser en production.
services:
  ms-patrimoine:
    ports: ["3001:3001"]
  ms-circuit:
    ports: ["3002:3002"]
  ms-evenement:
    ports: ["3003:3003"]
  ms-reservation:
    ports: ["3004:3004"]
  ms-auth:
    ports: ["3005:3005"]
  ms-avis:
    ports: ["3006:3006"]
