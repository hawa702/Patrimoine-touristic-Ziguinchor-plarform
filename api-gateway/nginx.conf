events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name localhost;

        # Configuration CORS globale
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 1. ms-auth-user (Auth, Guides, Avis, Signalements)
        location ~ ^/api/(auth|guides|avis|signalements) {
            proxy_pass http://ms-auth-user:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. ms-patrimoine
        location /api/patrimoines {
            proxy_pass http://ms-patrimoine:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. ms-circuit
        location /api/circuits {
            proxy_pass http://ms-circuit:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. ms-evenement
        location /api/evenements {
            proxy_pass http://ms-evenement:3003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. ms-reservation
        location /api/reservations {
            proxy_pass http://ms-reservation:3004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Page d'accueil statut du Gateway
        location / {
            default_type application/json;
            return 200 '{"status":"UP","message":"API Gateway Orchestrator - Gestion du Patrimoine Touristique","services":["ms-auth-user:3000","ms-patrimoine:3001","ms-circuit:3002","ms-evenement:3003","ms-reservation:3004"]}';
        }
    }
}
