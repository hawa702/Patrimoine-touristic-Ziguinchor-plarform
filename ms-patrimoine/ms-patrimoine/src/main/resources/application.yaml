server:
  port: 3001
spring:
  application:
    name: ms-patrimoine
  datasource:
    url: 'jdbc:h2:mem:patrimoinedb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: '*'
